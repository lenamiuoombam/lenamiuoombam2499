<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泰百剧4选1 PK｜选出你的最爱TOP5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#262522;background:#f7f5f2;}
body{min-height:100vh;padding:32px 24px 48px;background:linear-gradient(180deg,#f7f5f2 0,#fff 72%);}
h1{font-size:clamp(26px,4vw,38px);font-weight:750;line-height:1.2;text-align:center;color:#282522;}
.tip{max-width:660px;margin:10px auto 18px;color:#65615d;line-height:1.6;text-align:center;}
.progress{margin-bottom:8px;color:#65615d;text-align:center;font-size:14px;font-variant-numeric:tabular-nums;}
.progress-track{width:min(480px,100%);height:6px;margin:0 auto 30px;overflow:hidden;border-radius:3px;background:#e3dfda;}
.progress-track span{display:block;width:0;height:100%;background:#b74761;transition:width .25s ease;}
.wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;max-width:1120px;margin:0 auto;}
.card{min-width:0;overflow:hidden;border:1px solid #e7e2dc;border-radius:8px;background:#fff;color:#262522;box-shadow:0 2px 10px #342b2110;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
.card:hover{transform:translateY(-4px);border-color:#c38b98;box-shadow:0 8px 24px #342b211c;}
.card:focus-visible{outline:3px solid #2d7163;outline-offset:3px;}
.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#f0ebe7;}
.card img.contain{object-fit:contain;background:#ded7d2;}
.card .name{display:grid;min-height:58px;place-items:center;padding:10px 8px;text-align:center;font-size:15px;font-weight:650;line-height:1.35;}
.result-box{display:none;max-width:680px;margin:36px auto 0;padding:28px;border:1px solid #e7e2dc;border-radius:8px;background:#fff;box-shadow:0 8px 30px #342b2110;}
.result-box h2{margin-bottom:16px;text-align:center;font-size:24px;}
.rank-item{padding:12px 2px;border-bottom:1px solid #ece7e2;font-size:16px;line-height:1.5;}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:24px;text-align:center;}
.btns button{min-height:44px;padding:10px 20px;border:0;border-radius:6px;background:#b74761;color:#fff;font-size:15px;font-weight:650;cursor:pointer;}
.btns button:last-child{background:#e6efeb;color:#235a4f;}
.btns button:hover{filter:brightness(.96);}
.btns button:focus-visible{outline:3px solid #2d7163;outline-offset:2px;}
@media (max-width:720px){body{padding:24px 14px 36px}.wrap{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card .name{min-height:54px;font-size:14px}.result-box{padding:22px 18px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<h1>泰百剧 4选1 PK</h1>
<div class="tip">不用想太多，凭直觉选最喜欢的一部，结束自动算出你的最爱TOP5 ♡</div>
<div class="progress" id="progressText"></div>
<div class="progress-track" role="progressbar" aria-label="选择进度" aria-valuemin="0" aria-valuemax="80" aria-valuenow="0"><span id="progressBar"></span></div>

<div class="wrap" id="pkWrap"></div>

<div class="result-box" id="resultBox">
  <h2>✨ 你的最爱TOP5 ✨</h2>
  <div id="rankList"></div>
  <div class="btns">
    <button type="button" onclick="copyResult()">复制排名分享</button>
    <button type="button" onclick="restart()">重新选一次</button>
  </div>
</div>

<script>
// 73 部泰百剧清单；已确认的海报保存在本地 assets/posters 目录。

  {name:"爱在球道上",img:"assets/posters/68.jpg"},

  {name:"可以爱吗",img:"assets/posters/70.jpg"},
  {name:"第三者",img:"assets/posters/71.jpg"},
  {name:"筑爱于心",img:"assets/posters/72.jpg"},
  {name:"分手代理",img:"assets/posters/73.jpg"},
];
const MAX_ROUND = 80; // 4选1推荐60~100轮，数字越大排名越稳定
// ======================================================
let score = {};
let currentRound = 0;
let topResultText = "";
dramaList.forEach(d=>score[d.name]=0);

// 随机抽取4部互不重复的剧
function getRandomFour(){
  const selected = [];
  while(selected.length < 4){
    const idx = Math.floor(Math.random()*dramaList.length);
    if(!selected.includes(dramaList[idx])){
      selected.push(dramaList[idx]);
    }
  }
  return selected;
}

function renderPK(){
  const wrap=document.getElementById('pkWrap');
  const box=document.getElementById('resultBox');
  const progress=document.getElementById('progressText');
  const progressBar=document.getElementById('progressBar');
  box.style.display='none';
  progress.innerText=`进度：${currentRound} / ${MAX_ROUND}`;
  progressBar.style.width=`${Math.min(100,currentRound/MAX_ROUND*100)}%`;
  progressBar.parentElement.setAttribute('aria-valuenow',currentRound);
  if(currentRound >= MAX_ROUND){
    showResult();
    return;
  }
  const fourList = getRandomFour();
  let cardHtml = "";
  fourList.forEach(item=>{
    cardHtml += `
      <button type="button" class="card" onclick="pick('${item.name}')" aria-label="选择 ${item.name}">
        <img class="${item.fit || ''}" src="${item.img}" alt="${item.name} 海报" onerror="this.onerror=null;this.src='assets/posters/fallback.svg'">
        <div class="name">${item.name}</div>
      </button>
    `
  })
  wrap.innerHTML = cardHtml;
}

function pick(name){
  score[name]++;
  currentRound++;
  renderPK();
}

function showResult(){
  document.getElementById('pkWrap').innerHTML='';
  document.getElementById('progressText').innerText='✅ 全部选择完毕！';
  document.getElementById('progressBar').style.width='100%';
  const box=document.getElementById('resultBox');
  box.style.display='block';
  const sortArr = Object.entries(score).sort((x,y)=>y[1]-x[1]);
  const top5 = sortArr.slice(0,5);
  topResultText = "我的泰百剧TOP5：\n";
  let html='';
  top5.forEach((item,i)=>{
    html += `<div class="rank-item">第${i+1}名：${item[0]}｜获得 ${item[1]} 票</div>`
    topResultText += `第${i+1}名：${item[0]}\n`;
  })
  document.getElementById('rankList').innerHTML=html;
}

// 复制排名
function copyResult(){
  navigator.clipboard.writeText(topResultText).then(()=>{
    alert("✅ 排名复制成功！发给同担吧");
  }).catch(()=>{
    alert("复制失败，手动复制：\n"+topResultText);
  })
}

function restart(){
  currentRound=0;
  dramaList.forEach(d=>score[d.name]=0);
  renderPK();
}
renderPK();
</script>
</body>
</html>
